<div class="card-controls">
<button id="prev-card" type="button" aria-label="上一张">←</button>
<span id="card-counter" aria-live="polite"></span>
<button id="next-card" type="button" aria-label="下一张">→</button>
<button id="overview-card" type="button" title="幻灯片浏览" aria-label="幻灯片浏览">▦</button>

</div>

<div class="card-progress">

</div>

</div>
<div id="card-overview-list"></div>
</div>
</div>
