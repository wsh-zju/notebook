<div class="hero-custom-container">
    <nav class="hero-nav-links">
        <a href="{{ 'weixin/' | url }}" class="hero-link-item">
            <span class="twemoji">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12.01 2c5.52 0 10 3.73 10 8.33 0 4.6-4.48 8.33-10 8.33-.87 0-1.71-.09-2.5-.26l-3.3 2.05-.3-.24 1.14-3.52C5.07 14.7 3.5 12.87 3.5 10.33 3.5 5.73 7.98 2 12.01 2zm-4.5 4.5c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5 1.5-.67 1.5-1.5-.67-1.5-1.5-1.5zm9 0c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5 1.5-.67 1.5-1.5-.67-1.5-1.5-1.5z"/>
            </svg>
            </span>
            公众号
        </a>
        <span class="hero-divider">/</span>
        <a href="https://wsh-zju.github.io/blog/" class="hero-link-item">
            <span class="twemoji">{% include ".icons/octicons/link-16.svg" %}</span>
            Blog
        </a>
        <span class="hero-divider">/</span>
        <a href="javascript:void(0);" onclick="toggle_statistics()" class="hero-link-item">
            <span class="twemoji">{% include ".icons/material/chart-line.svg" %}</span>
            站点统计
        </a>
    </nav>

    <div id="statistics-card" class="glass-stats-card">
        <div class="stats-line">页面总数：{{ pages | length }}</div>
        <div class="stats-line">总字数：{{ words }}</div>
        <div class="stats-line">代码行数：{{ codes }}</div>
        <div class="stats-line">运行时间：<span id="web-time-display"></span></div>
    </div>
</div>

<style>
/* 1. 缩小与大标题的间距 */
.hero-custom-container {
    margin-top: 0.5rem; /* 从 2rem 缩小到 0.5rem */
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
}

/* 2. 颜色适配逻辑 */

/* 默认状态（白天/浅色模式）：使用深色文字 */
.hero-link-item, .hero-divider, .stats-line {
    color: #333333 !important; /* 深灰色，比纯黑更有高级感 */
}
.hero-link-item svg {
    fill: #333333; /* 确保图标也是深色 */
}
.glass-stats-card {
    background: rgba(0, 0, 0, 0.05); /* 浅色背景 */
    border: 1px solid rgba(0, 0, 0, 0.1);
}

/* 自动适配 MkDocs 的夜间模式 (Slate 方案) */
[data-md-color-scheme="slate"] .hero-link-item,
[data-md-color-scheme="slate"] .hero-divider,
[data-md-color-scheme="slate"] .stats-line {
    color: #ffffff !important; /* 纯白文字 */
}
[data-md-color-scheme="slate"] .hero-link-item svg {
    fill: #ffffff;
}
[data-md-color-scheme="slate"] .glass-stats-card {
    background: rgba(255, 255, 255, 0.1); /* 深色背景下的半透明亮色 */
    border: 1px solid rgba(255, 255, 255, 0.2);
}

/* 基础结构样式保持不变 */
.hero-nav-links {
    font-size: 0.85rem;
    display: flex;
    align-items: flex-end;
}

.hero-link-item {
    text-decoration: none !important;
    transition: all 0.3s;
    display: inline-flex;
    align-items: center;
    gap: 5px;
}

.hero-link-item:hover {
    opacity: 0.6;
}
.hero-divider {
    margin: 0 5px;
}

.glass-stats-card {
    text-align: right; /* 卡片内文字靠右 */
    border: none !important;
    backdrop-filter: blur(10px); /* 玻璃效果 */
    -webkit-backdrop-filter: blur(10px);
    border-radius: 12px;
    padding: 12px 20px; 
    opacity: 0;
    visibility: hidden;
    transform: translateY(-5px);
    transition: all 0.3s ease;
}

.glass-stats-card.is-active {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

.stats-line {
    font-size: 0.75rem; 
    margin: 4px 0; 
}
</style>

<script>
// 时间更新和切换逻辑保持不变
function updateTime() {
    var startDate = new Date("2025/04/20 14:32:00");
    var now = new Date();
    var diff = now.getTime() - startDate.getTime();
    var y = Math.floor(diff / (365 * 24 * 3600 * 1000));
    diff -= y * 365 * 24 * 3600 * 1000;
    var d = Math.floor(diff / (24 * 3600 * 1000));
    var h = Math.floor(diff / (3600 * 1000) % 24);
    var m = Math.floor(diff / (60 * 1000) % 60);
    document.getElementById("web-time-display").innerHTML = (y > 0 ? y + "年 " : "") + d + "天 " + h + "时 " + m + "分";
    setTimeout(updateTime, 60000);
}
updateTime();

function toggle_statistics() {
    document.getElementById("statistics-card").classList.toggle("is-active");
}
</script>
